name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test and verify the app (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Run tests
        run: pytest -q

      - name: Check imports
        env:
          PYTHONPATH: src:.
        run: python -c "import data_processor, app; print('Imports OK')"

      - name: Check Streamlit startup
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8501 \
            > /tmp/streamlit.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health >/dev/null 2>&1; then
              echo "Streamlit health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Streamlit did not become healthy in time" >&2
          cat /tmp/streamlit.log
          exit 1
